---
- name: Ensure namespace exists
  k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ namespace }}"
    host: "{{ server }}"
    api_key: "{{ token }}"
    verify_ssl: "{{ verify_ssl }}"
  when: non_admin_user == false

- name: Deploy robot shop sample application
  k8s:
    host: "{{ server }}"
    api_key: "{{ token }}"
    verify_ssl: "{{ verify_ssl }}"
    state: present
    definition: "{{ lookup('template', 'manifest.yml') | from_yaml_all | list }}"

- name: Wait for mysql pod to start running
  k8s_info:
    host: "{{ server }}"
    api_key: "{{ token }}"
    verify_ssl: "{{ verify_ssl }}"
    kind: Pod
    namespace: "{{ namespace }}"
    label_selectors:
      - service=mysql
    field_selectors:
      - status.phase=Running
  register: mysql_pod
  until: "true in (mysql_pod | json_query('resources[].status.containerStatuses[].ready'))"
  retries: 30

- name: Wait until mysql database initialization is done
  kubernetes.core.k8s_exec:
    host: "{{ server }}"
    api_key: "{{ token }}"
    verify_ssl: "{{ verify_ssl }}"
    namespace: "{{ namespace }}"
    pod: "{{ (mysql_pod.resources|first).metadata.name }}"
    container: mysql
    command: /bin/sh -c "mysql -uroot -pR00t@123 -e \"USE cities; SHOW TABLES;\""
  register: result
  until: result.rc == 0 and (result.stdout is search('Tables_in_cities')) and (result.stdout is search('cities'))
  retries: 15
  delay: 40
  changed_when: false
