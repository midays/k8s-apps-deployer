---
- name: Check pods status
  k8s_info:
    host: "{{ server }}"
    api_key: "{{ token }}"
    verify_ssl: "{{ verify_ssl }}"
    kind: Pod
    namespace: "{{ namespace }}"
    label_selectors:
      - app={{ app_name }}
  register: pod
  until: >-
    pod.resources|default([])|length > 0 and
    pod | json_query('resources[*].status.containerStatuses[*].ready') | flatten |difference( [true] ) | length  == 0
  retries: 100
  delay: 3

- name: Set pod name fact
  set_fact:
    pod_name: "{{ (pod.resources | first).metadata.name }}"

- name: Obtain route (OpenShift only)
  k8s_info:
    host: "{{ server }}"
    api_key: "{{ token }}"
    verify_ssl: "{{ verify_ssl }}"
    kind: Route
    namespace: "{{ namespace }}"
    label_selectors:
      - app={{ app_name }}
  register: nginx_route
  when: is_openshift | default(false) | bool

- name: Ensure route exists on OpenShift
  assert:
    that:
      - nginx_route.resources | default([]) | length > 0
    fail_msg: "OpenShift route for {{ app_name }} is missing"
    success_msg: "OpenShift route exists for {{ app_name }}"
  when: is_openshift | default(false) | bool

# OpenShift: external URL via Route. A fresh deploy has no content in the html
# PVC yet, so 403 (directory listing forbidden) is an expected "reachable"
# response too, same as 200 once a test writes content into it.
- name: Access the site via OpenShift Route
  uri:
    url: "http://{{ nginx_route.resources[0].spec.host }}/"
    method: GET
    status_code:
      - 200
      - 403
  register: route_probe
  retries: 30
  delay: 10
  until: route_probe is success
  when:
    - is_openshift | default(false) | bool
    - nginx_route.resources | default([]) | length > 0

# Kind / vanilla K8s: no Route — probe with curl inside the pod. No -f flag:
# a 403 on the empty html dir is a valid "reachable" response here too, and
# curl without -f still exits 0 for any completed HTTP response.
- name: Probe HTTP from inside pod (no OpenShift Route)
  kubernetes.core.k8s_exec:
    host: "{{ server }}"
    api_key: "{{ token }}"
    verify_ssl: "{{ verify_ssl }}"
    namespace: "{{ namespace }}"
    pod: "{{ pod_name }}"
    container: "{{ app_name }}"
    command: curl -s -o /dev/null http://127.0.0.1:8080/
  register: curl_probe
  until: curl_probe is succeeded
  retries: 30
  delay: 10
  when: not (is_openshift | default(false) | bool)
